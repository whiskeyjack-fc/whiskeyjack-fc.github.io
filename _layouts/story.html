---
layout: default
---
<article class="story">
  <h1 class="story-title">{{ page.title }}</h1>

  {% if page.blurb %}
  <p class="story-blurb"><em>{{ page.blurb }}</em></p>
  {% endif %}

  {% if page.credit %}
  <p class="story-credit"><em>{{ page.credit }}</em></p>
  {% endif %}

  <div class="story-body">
    {{ content }}
  </div>
</article>
